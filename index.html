  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --paper: #e7e8e2;
      --panel: #ddded7;
      --ink: #15181e;
      --ink-soft: #454a54;
      --line: #c4c6bd;
      --line-strong: #a6a99f;
      --graphite: #111217;
      --white: #f4f5f0;
      --compression: #274a78;
      --tension: #bd3b22;
      --wrap: 1180px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-size: 16.5px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--compression); outline-offset: 3px; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 28px; }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(231, 232, 226, 0.9);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand span {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .brand-mark img {
      height: 28px;
      width: auto;
      display: block;
    }

    nav {
      display: flex;
      gap: 18px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    nav a:hover { color: var(--ink); }

    .section { padding: 88px 0; }
    .section--tight { padding: 72px 0; }
    .section--panel {
      background: var(--panel);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .section--graphite {
      background: var(--graphite);
      color: var(--white);
      border-top: 1px solid #2c313b;
    }

    .eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .eyebrow::before {
      content: "";
      width: 32px;
      height: 1px;
      background: var(--tension);
      flex: none;
    }
    .eyebrow--light { color: #9aa0ab; }
    .eyebrow--light::before { background: var(--tension); }

    h1, h2, h3 {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      line-height: 1.06;
      letter-spacing: -0.02em;
    }
    h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); margin-bottom: 16px; }
    h2 { font-size: clamp(1.7rem, 3.1vw, 2.4rem); margin-bottom: 16px; }
    h3 { font-size: 1.1rem; margin-bottom: 6px; }
    p { color: var(--ink-soft); max-width: 44em; }

    .hero {
      border-bottom: 1px solid var(--line);
      background: radial-gradient(circle at top left, #f9fafb, var(--paper));
    }
    .hero-inner {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 52px;
      align-items: center;
    }
    .hero-tagline {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }
    .hero-body {
      font-size: 1.02rem;
      margin-bottom: 26px;
    }
    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }
    .btn {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 22px;
      border-radius: 999px;
      border: 1px solid var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ink);
      color: var(--white);
      transition: 0.18s ease;
    }
    .btn:hover { background: transparent; color: var(--ink); }
    .btn--ghost { background: transparent; color: var(--ink); }
    .btn--ghost:hover { background: var(--ink); color: var(--white); }
    .btn .arrow { transition: transform 0.18s ease; }
    .btn:hover .arrow { transform: translateX(3px); }

    .hero-note {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .hero-figure {
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      padding: 18px 18px 14px;
      background: var(--panel);
    }
    .hero-figure img.hero-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin-bottom: 12px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
    }
    .hero-node {
      border-radius: 12px;
      padding: 10px 10px 9px;
      background: var(--paper);
      border: 1px solid var(--line-strong);
      min-height: 80px;
    }
    .hero-node-label {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.65rem;
      margin-bottom: 4px;
      color: var(--ink-soft);
    }
    .hero-node--source { border-color: var(--tension); }
    .hero-node--terminal { border-color: var(--compression); }

    .hero-caption {
      margin-top: 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-align: right;
    }

    .divisions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 32px;
    }
    .division {
      border-radius: 14px;
      border: 1px solid var(--line-strong);
      background: var(--paper);
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .division-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .division-title { font-size: 1.02rem; font-weight: 600; }
    .division-body { font-size: 0.9rem; color: var(--ink-soft); }
    .division-links {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .division-links a { border-bottom: 1px solid transparent; }
    .division-links a:hover { border-bottom-color: var(--ink); }

    .about-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: 40px;
      margin-top: 24px;
    }
    .about-body p { margin-bottom: 14px; }
    .about-side {
      border-radius: 14px;
      border: 1px solid var(--line-strong);
      padding: 18px 18px 16px;
      background: var(--panel);
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .network-grid {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
    }
    .network-block {
      border-radius: 14px;
      border: 1px solid #2c313b;
      padding: 18px 18px 14px;
    }
    .network-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9aa0ab;
      margin-bottom: 8px;
    }
    .network-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      color: var(--white);
      margin-bottom: 6px;
    }
    .network-links {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: #cdd2da;
    }
    .network-links a:hover { color: var(--white); }

    .hosts-list { margin-top: 18px; font-size: 0.9rem; color: #cdd2da; }
    .hosts-list ul { list-style: none; padding-left: 0; margin-top: 12px; }
    .hosts-list li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 8px;
    }
    .hosts-list li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: #8a909b;
    }

    footer {
      padding: 26px 0 32px;
      background: var(--graphite);
      color: #9aa0ab;
      border-top: 1px solid #2c313b;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
    }
    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .hero-inner { grid-template-columns: 1fr; gap: 32px; }
      .section, .section--tight { padding: 64px 0; }
      .about-grid { grid-template-columns: 1fr; }
      nav { display: none; }
      .wrap { padding: 0 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
